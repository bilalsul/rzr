name: Build Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm
            abi: armeabi-v7a
            out_file: app-armeabi-v7a-release.apk
            flags: --split-per-abi --target-platform=android-arm --dart-define=isFdroid=true
          - target: android-arm64
            abi: arm64-v8a
            out_file: app-arm64-v8a-release.apk
            flags: --split-per-abi --target-platform=android-arm64 --dart-define=isFdroid=true
          - target: android-x64
            abi: x86_64
            out_file: app-x86_64-release.apk
            flags: --split-per-abi --target-platform=android-x64 --dart-define=isFdroid=true
          - target: universal
            abi: universal
            out_file: app-release.apk
            flags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ inputs.flutter_version }}

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Setup Android signing
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=release-keystore.jks" >> android/key.properties
          fi

      - name: Build for Android (${{ matrix.abi }})
        working-directory: ${{ github.workspace }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: release-keystore.jks
        run: |
          flutter gen-l10n
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          flutter build apk --release ${{ matrix.flags }}

      - name: Rename build
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          cd build/app/outputs/flutter-apk
          mv ${{ matrix.out_file }} RZR-android-${{ inputs.version }}-${{ matrix.abi }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact-${{ matrix.abi }}
          path: ${{ github.workspace }}/build/app/outputs/flutter-apk/RZR-android-${{ inputs.version }}-${{ matrix.abi }}.apk
          if-no-files-found: error

  merge-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Merge Android artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: android-artifacts
          pattern: android-artifact-*
