name: Build iOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ inputs.flutter_version }}

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build for iOS
        run: |
          flutter gen-l10n
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          flutter build ios --release --no-codesign
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r RZR-ios-${{ inputs.version }}-unsigned.zip Payload
          cp RZR-ios-${{ inputs.version }}-unsigned.zip RZR-ios-${{ inputs.version }}-unsigned.ipa
          mkdir -p ../../ios
          cp RZR-ios-${{ inputs.version }}-unsigned.ipa ../../ios/
          cp RZR-ios-${{ inputs.version }}-unsigned.zip ../../ios/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: |
            build/ios/*.ipa
            build/ios/*.zip
          if-no-files-found: error
