        asset_path: RZR-android-x86_64-${{steps.parse-release-tag.outputs.version}}.apk
        asset_name: RZR-android-x86_64-${{steps.parse-release-tag.outputs.version}}.apk
        asset_content_type: application/java-archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload the artifacts — universal Apk file
      if: matrix.file == 'apk'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: RZR-android-${{steps.parse-release-tag.outputs.version}}-universal.apk
        path: RZR-android-${{steps.parse-release-tag.outputs.version}}-universal.apk
        if-no-files-found: error

    - name: Upload the release asset — universal Apk file
      if: matrix.file == 'apk'
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: RZR-android-${{steps.parse-release-tag.outputs.version}}-universal.apk
        asset_name: RZR-android-${{steps.parse-release-tag.outputs.version}}-universal.apk
        asset_content_type: application/java-archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
