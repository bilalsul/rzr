name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      is_alpha:
        required: true
        type: string
      is_beta:
        required: true
        type: string
      release_notes:
        required: true
        type: string
    secrets:
      TELEGRAM_TO:
        required: false
      TELEGRAM_TOKEN:
        required: false
      MASTODON_TOKEN:
        required: false
      MASTODON_INSTANCE:
        required: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/android-artifacts/*.apk
            artifacts/ios-artifacts/*.ipa
            artifacts/ios-artifacts/*.zip
          body: ${{ inputs.release_notes }}
          generate_release_notes: false
          prerelease: ${{ inputs.is_beta == 'true' || inputs.is_alpha == 'true' }}

      - name: Format changelog for Telegram
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != '' }}
        id: format_changelog
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          MAIN_VERSION=${VERSION%%-*}

          FORMATTED_NOTES=$(node scripts/format_telegram_message.js assets/CHANGELOG.md "$MAIN_VERSION" 2>&1) || {
            echo "::warning::Format script failed, using original notes"
            FORMATTED_NOTES='${{ inputs.release_notes }}'
          }

          {
            echo "formatted_notes<<EOF"
            echo "$FORMATTED_NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send release message to Telegram
        if: ${{ inputs.is_beta != 'true' && inputs.is_alpha != 'true' && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🎉 *New Release Available!*

            🚀 **Version:** `${{ inputs.version }}`

            **What's New:**
            ${{ steps.format_changelog.outputs.formatted_notes }}

            📥 **Download:** https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}

      - name: Format changelog for Mastodon
        if: ${{ inputs.is_beta != 'true' && inputs.is_alpha != 'true' && env.MASTODON_TOKEN != '' }}
        id: format_mastodon
        shell: bash
        run: |
          MASTODON_TEXT=$(node scripts/format_mastodon_message.js assets/CHANGELOG.md "${{ inputs.version }}" "${{ inputs.is_beta }}" "${{ github.repository }}" "${{ inputs.tag }}")

          {
            echo "mastodon_message<<EOF"
            echo "$MASTODON_TEXT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post release to Mastodon
        if: ${{ inputs.is_beta != 'true' && inputs.is_alpha != 'true' && env.MASTODON_TOKEN != '' }}
        uses: cbrgm/mastodon-github-action@v2
        with:
          access-token: ${{ env.MASTODON_TOKEN }}
          url: ${{ env.MASTODON_INSTANCE || 'https://fe.disroot.org' }}
          message: ${{ steps.format_mastodon.outputs.mastodon_message }}
