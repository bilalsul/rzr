  build:
    name: Build the ${{ matrix.file }} file
    # needs: testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            file: apk
            asset-content-type: application/java-archive
          # - os: ubuntu-latest
          #   file: aab
          #   asset-content-type: application/zip
          # - os: macos-latest
          #   file: ipa
          #   asset-content-type: application/octet-stream
      fail-fast: false
    env:
      FLUTTER_DEBUG_INFO_PATH: build/app/outputs/symbols
    steps:
    - name: Check matrix
      if: ${{ !(matrix.file == 'apk' && github.event.release.prerelease) || ((matrix.file == 'aab' || matrix.file == 'ipa') && !github.event.release.prerelease) }}
      run: exit
    - name: Clone the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: code
    - name: Remove unrelated folders
      run: |
        rm -rf code/screens code/.github
        # Add other unrelated folders here if needed, e.g., rm -rf code/other_folder
    - name: Get Flutter version
      id: get-flutter-version
      uses: zgosalvez/github-actions-get-flutter-version-env@34a86de9beede9d0771465c702d530c2aea2b1ee
      with:
        pubspec-file-path: code/pubspec.yaml
    - name: Cache Flutter
      id: flutter-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: flutter
        key: ${{ env.cache-name }}-${{ matrix.os }}-${{ steps.get-flutter-version.outputs.version }}-${{ hashFiles('code/pubspec.lock') }}
        restore-keys: |
          ${{ env.cache-name }}-${{ matrix.os }}-${{ steps.get-flutter-version.outputs.version }}-
          ${{ env.cache-name }}-${{ matrix.os }}-
          ${{ env.cache-name }}-
      env:
        cache-name: flutter-cache
    - name: Clone the Flutter repository
      if: steps.flutter-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: flutter/flutter
        ref: ${{ steps.get-flutter-version.outputs.version }}
        path: flutter
    - name: Add the flutter tool to the path
      run: |
        echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH
    - name: Populate the Flutter tool's cache of binary artifacts
      if: steps.flutter-cache.outputs.cache-hit != 'true'
      run: |
        flutter config --no-analytics
        flutter precache
    - name: Get Flutter packages
      run: flutter pub get
      working-directory: code

    - name: Parse the release tag
      id: parse-release-tag
      run: |
        VERSION=${{ github.event.release.tag_name }}
        echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
      working-directory: code

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
      working-directory: code

    - name: Set build path
      run: |
        sudo mkdir -p /home/vagrant/build
        sudo rm -rf /home/vagrant/build/bilalsul.rzr
        sudo cp -a "$GITHUB_WORKSPACE/code" /home/vagrant/build/bilalsul.rzr
        sudo chown -R "$USER:$USER" /home/vagrant/build

    - name: Generate code
      working-directory: /home/vagrant/build/bilalsul.rzr
      run: |
        flutter gen-l10n
        dart run build_runner build --delete-conflicting-outputs

    - name: Build Split APKs
      working-directory: /home/vagrant/build/bilalsul.rzr
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_PATH: release-keystore.jks
      run: flutter build apk --release --split-per-abi

    - name: Rename split APKs
      working-directory: /home/vagrant/build/bilalsul.rzr
      run: |
        VERSION=${{ steps.parse-release-tag.outputs.version }}
        mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/RZR-android-armeabi-v7a-${VERSION}.apk"
        mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/RZR-android-arm64-v8a-${VERSION}.apk"
        mv build/app/outputs/flutter-apk/app-x86_64-release.apk "$GITHUB_WORKSPACE/RZR-android-x86_64-${VERSION}.apk"

    - name: Build universal APK
      working-directory: /home/vagrant/build/bilalsul.rzr
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_PATH: release-keystore.jks
      run: flutter build apk --release

    - name: Rename universal APK
      working-directory: /home/vagrant/build/bilalsul.rzr
      run: |
        VERSION=${{ steps.parse-release-tag.outputs.version }}
        mv build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/RZR-android-${VERSION}-universal.apk"
