    - name: Upload the artifacts — armeabi-v7a Apk file
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: RZR-android-armeabi-v7a-${{steps.parse-release-tag.outputs.version}}.apk
        path: RZR-android-armeabi-v7a-${{steps.parse-release-tag.outputs.version}}.apk
        if-no-files-found: error
    - name: Upload the release asset — armeabi-v7a Apk file
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5
      with:
